<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="48" cy="48" r="45" fill="#0066cc" opacity="0.1" stroke="#0066cc" stroke-width="1.5"/>
  
  <!-- Clock body -->
  <circle cx="48" cy="52" r="34" fill="#0066cc" stroke="#0066cc" stroke-width="1.5"/>
  
  <!-- Clock face white -->
  <circle cx="48" cy="52" r="30" fill="white"/>
  
  <!-- Hour marks -->
  <line x1="48" y1="26" x2="48" y2="28" stroke="#0066cc" stroke-width="1.5"/>
  <line x1="48" y1="76" x2="48" y2="78" stroke="#0066cc" stroke-width="1.5"/>
  <line x1="22" y1="52" x2="20" y2="52" stroke="#0066cc" stroke-width="1.5"/>
  <line x1="76" y1="52" x2="78" y2="52" stroke="#0066cc" stroke-width="1.5"/>
  
  <!-- Hour hand (pointing to 10) -->
  <line x1="48" y1="52" x2="40" y2="41" stroke="#0066cc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Minute hand (pointing to 2) -->
  <line x1="48" y1="52" x2="59" y2="39" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="48" cy="52" r="2" fill="#0066cc"/>
  
  <!-- Alert exclamation mark (top right) -->
  <circle cx="70" cy="26" r="13" fill="#FF6B6B"/>
  <text x="70" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="white">!</text>
</svg>
