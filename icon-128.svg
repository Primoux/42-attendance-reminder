<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0066cc" opacity="0.1" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Clock body -->
  <circle cx="64" cy="70" r="45" fill="#0066cc" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Clock face white -->
  <circle cx="64" cy="70" r="40" fill="white"/>
  
  <!-- Hour marks -->
  <line x1="64" y1="35" x2="64" y2="38" stroke="#0066cc" stroke-width="2"/>
  <line x1="64" y1="102" x2="64" y2="105" stroke="#0066cc" stroke-width="2"/>
  <line x1="29" y1="70" x2="26" y2="70" stroke="#0066cc" stroke-width="2"/>
  <line x1="102" y1="70" x2="105" y2="70" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Hour hand (pointing to 10) -->
  <line x1="64" y1="70" x2="54" y2="55" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Minute hand (pointing to 2) -->
  <line x1="64" y1="70" x2="78" y2="52" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="70" r="3" fill="#0066cc"/>
  
  <!-- Alert exclamation mark (top right) -->
  <circle cx="95" cy="35" r="18" fill="#FF6B6B"/>
  <text x="95" y="42" font-size="24" font-weight="bold" text-anchor="middle" fill="white">!</text>
</svg>
