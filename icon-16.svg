<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock body -->
  <circle cx="8" cy="9" r="6.5" fill="#0066cc" stroke="#0066cc" stroke-width="0.8"/>
  
  <!-- Clock face -->
  <circle cx="8" cy="9" r="5.5" fill="white"/>
  
  <!-- Hour hand -->
  <line x1="8" y1="9" x2="7.5" y2="6" stroke="#0066cc" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Minute hand -->
  <line x1="8" y1="9" x2="10" y2="5.5" stroke="#FF6B6B" stroke-width="0.6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="8" cy="9" r="0.8" fill="#0066cc"/>
  
  <!-- Alert badge -->
  <circle cx="12" cy="4" r="3.5" fill="#FF6B6B"/>
  <text x="12" y="5.5" font-size="4" font-weight="bold" text-anchor="middle" fill="white">!</text>
</svg>
