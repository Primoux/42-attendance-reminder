name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # web-ext, lancé par `npm run lint`, exige Node >= 20
          node-version: 20
      - run: npm test
      - run: npm run lint
      - run: npm run build
