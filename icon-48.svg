<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Clock body -->
  <circle cx="24" cy="28" r="18" fill="#0066cc" stroke="#0066cc" stroke-width="1.5"/>
  
  <!-- Clock face -->
  <circle cx="24" cy="28" r="16" fill="white"/>
  
  <!-- Hour hand -->
  <line x1="24" y1="28" x2="22" y2="18" stroke="#0066cc" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Minute hand -->
  <line x1="24" y1="28" x2="30" y2="16" stroke="#FF6B6B" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="24" cy="28" r="1.5" fill="#0066cc"/>
  
  <!-- Alert badge -->
  <circle cx="35" cy="14" r="7" fill="#FF6B6B"/>
  <text x="35" y="18" font-size="10" font-weight="bold" text-anchor="middle" fill="white">!</text>
</svg>
